# https://tmuxcheatsheet.com/
# basic shortcuts about session:
# https://www.youtube.com/watch?v=yj4JKhbmHAw

# set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# make reload shortcut
unbind r
bind r source-file ~/.tmux.conf

# general settings
set -g mouse on
set -g history-limit 1000000 # default 2k
set -g set-clipboard on # use system clipboard
setw -g mode-keys vi
set -s escape-time 0
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g status-interval 3
set -g display-time 4000 #tmux messages display time from 750ms to 4s


# vim navigation style
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Shift+Alt (Windows) / Shift+Option (macOS) to switch windows
# macOS: set Option key to send Esc+ in your terminal (iTerm2: Profiles > Keys > Left Option Key: Esc+)
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# terminal true color support (OS-aware)
if-shell 'uname | grep -q Darwin' \
  'set -g default-terminal "tmux-256color"; set-option -sa terminal-overrides ",xterm-256color:RGB"'
if-shell 'uname | grep -q Linux' \
  'set -g default-terminal "screen-256color"; set-option -sa terminal-overrides ",xterm*:Tc"'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


# Theme / visual settings
set-option -g status-position top
set -g @catppuccin_flavor "mocha"

# v2 migration: window_status_style replaces the old default_fill/current_fill
# options. "rounded" gives the built-in rounded powerline caps around each
# window tab — the old v0.3.0 custom separator characters (""/" "/" █") were
# tuned for a different rendering pipeline and don't produce rounding here,
# so this uses the shipped preset instead of hand-rolling "custom" separators.
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(🔎),}"
set -g @catppuccin_window_text "#W" # v2 rename of @catppuccin_window_default_text

# NOTE: left/right separator left at v2.3.0's own defaults (rounded powerline
# caps) rather than carrying over the old v0.3.0 " "/"" values — those names
# were repurposed between versions, and the old values blanked out the
# rounded look this theme has by default.
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_date_time_text "#(env TZ=Europe/Brussels date +'%%Y-%%m-%%d %%H:%%M')"

# v2 removed @catppuccin_status_modules_{left,right}; the theme has to be
# loaded (to compute the @catppuccin_status_<module> values below) *before*
# status-right is set. TPM's own `run` further down reloads it harmlessly.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-right-length 100
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# tmux session plugin settings
set -g @continuum-restore "on"
set -g @continuum-save-interval '1'

# run command to install tmp
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# press leader + I (captial i) to update plugins

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

